<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order summary preview card design</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="images/favicon-32x32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="card">
      <img src="images/illustration-hero.svg" alt="" class="product-img" />
      <div class="summary-wrapper">
        <h1 class="order-summary">Order Summary</h1>
        <p class="order-description">
          You can now listen to missions of songs, audiobooks, and podcasts on
          any device anywhere you like!
        </p>
        <div class="order-summary-wrapper">
          <img src="images/icon-music.svg" alt="" class="icon" />
          <div class="plan-wrapper">
            <h2 class="plan">Annual Plan</h2>
            <p class="price">$59.99/year</p>
          </div>
          <a href="#" class="change-plan">Change</a>
        </div>
        <button class="confirm-order">Proceed to Payment</button>
        <button class="cancel-order">Cancel Order</button>
      </div>
    </div>
  </body>
</html>
